[project]
name = "archref-ml"
version = "0.1.0"
description = "Production-ready Machine Learning Architecture Reference"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
keywords = ["machine-learning", "mlops", "fastapi", "mlflow", "template"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "joblib>=1.3",
]

[project.optional-dependencies]
# Task plugins
classification = [
    "scikit-learn>=1.3",
]
regression = [
    "scikit-learn>=1.3",
]
clustering = [
    "scikit-learn>=1.3",
    "hdbscan>=0.8",
]
timeseries = [
    "statsmodels>=0.14",
]

# Integrations
mlflow = [
    "mlflow>=2.9",
]

# Visualization
viz = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

# Notebooks
notebook = [
    "jupyter>=1.0",
    "notebook>=7.0",
]

# Bundles
all = [
    "archref-ml[classification,regression,clustering,mlflow,viz]",
]

# Development
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "httpx>=0.25",
    "mypy>=1.8",
    "ruff>=0.1",
    "pre-commit>=3.6",
    "pandas-stubs>=2.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
archref-train = "src.pipeline:main"
archref-serve = "src.app.main:run_server"

[project.urls]
Homepage = "https://github.com/your-username/archref-ml"
Documentation = "https://github.com/your-username/archref-ml#readme"
Repository = "https://github.com/your-username/archref-ml"
Issues = "https://github.com/your-username/archref-ml/issues"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

# =============================================================================
# PYTEST
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "api: API tests",
    "slow: Slow running tests",
]
asyncio_mode = "auto"

# =============================================================================
# MYPY
# =============================================================================
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
show_column_numbers = true
pretty = true

# Third party libraries without stubs
[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "joblib.*",
    "mlflow.*",
    "hdbscan.*",
    "statsmodels.*",
]
ignore_missing_imports = true

# =============================================================================
# RUFF
# =============================================================================
[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented code)
    "PL",     # Pylint
    "RUF",    # Ruff-specific
]
ignore = [
    "PLR0913",  # Too many arguments
    "PLR0915",  # Too many statements
    "PLR2004",  # Magic value comparison
    "TC003",    # Move imports to TYPE_CHECKING (not always practical)
    "PLC0415",  # Import not at top level (conditional imports)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# =============================================================================
# COVERAGE
# =============================================================================
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/__init__.py",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
show_missing = true
fail_under = 80
