services:
  api:
    build:
      context: .
      target: production
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./reports/logs:/app/reports/logs
    environment:
      - ML_LOG_LEVEL=INFO
    restart: unless-stopped

  train:
    build:
      context: .
      target: training
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./config.yaml:/app/config.yaml
      - ./reports:/app/reports
    profiles:
      - training

  test:
    build:
      context: .
      target: development
    volumes:
      - .:/app
    command: python -m pytest tests/ -v --tb=short
    profiles:
      - testing

  dev:
    build:
      context: .
      target: development
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload
    profiles:
      - dev

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    profiles:
      - mlflow

volumes:
  mlflow-data:
